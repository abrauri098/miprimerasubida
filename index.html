<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Web</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .contenedor{
            width: 80%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h1{
            text-align: center;
            color: #2c3e50;
        }

        p{
            text-align: center;
            color: #555;
            font-size: 18px;
        }

        .boton{
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 12px;
            text-align: center;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .boton:hover{
            background: #2980b9;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Bienvenido</h1>

        <p>
            ¡Bienvenido a nuestra página web!
        </p>

        <a href="#" class="boton">Ver más</a>
    </div>

</body>
</html>
